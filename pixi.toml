[workspace]
name = "image_gen"
description = "Qwen-Image-Edit-2511 image editing environment"
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation.env]
# Keep the ~57GB model snapshot on the shared volume next to the project so it
# survives container restarts.
HF_HOME = "$PIXI_PROJECT_ROOT/.hf"
HF_XET_HIGH_PERFORMANCE = "1"
TOKENIZERS_PARALLELISM = "false"

[dependencies]
python = "3.12.*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[pypi-dependencies]
torch = "*"
torchvision = "*"
# QwenImageEditPlusPipeline support for 2511 only exists on diffusers main.
diffusers = { git = "https://github.com/huggingface/diffusers" }
transformers = ">=4.57"
accelerate = "*"
safetensors = "*"
sentencepiece = "*"
protobuf = "*"
pillow = "*"
huggingface-hub = "*"
hf-transfer = "*"

[tasks.gpu-check]
description = "Report torch/CUDA visibility"
cmd = "python scripts/gpu_check.py"

[tasks.download]
description = "Fetch the Qwen-Image-Edit-2511 snapshot into .hf"
cmd = "python scripts/download_model.py"

[tasks.edit]
description = "Run an image edit (see scripts/edit.py --help)"
cmd = "python scripts/edit.py"

[tasks.tests]
description = "Run the image-edit test suite and build the review sheet"
cmd = "python scripts/run_tests.py"

# --- bench: model comparison env (newer diffusers/transformers) -------------
# Separate from the default env so the production 2511 pipeline is untouched.
# Qwen-Image-2.1 needs transformers>=5.17; FLUX 3 Klein needs diffusers main
# (ModularPipeline) and its prompt upsampler (Qwen3.5 in transformers).
[feature.bench.dependencies]
python = "3.12.*"

# no-default-feature drops the workspace activation env, so repeat it here.
[feature.bench.activation.env]
HF_HOME = "$PIXI_PROJECT_ROOT/.hf"
HF_XET_HIGH_PERFORMANCE = "1"
TOKENIZERS_PARALLELISM = "false"

[feature.bench.pypi-dependencies]
torch = "*"
torchvision = "*"
diffusers = { git = "https://github.com/huggingface/diffusers" }
transformers = ">=5.17"
accelerate = "*"
safetensors = "*"
sentencepiece = "*"
protobuf = "*"
pillow = "*"
huggingface-hub = "*"
hf-transfer = "*"
lpips = "*"
scikit-image = "*"
# Model server (scripts/qwen_server.py).
fastapi = "*"
uvicorn = "*"
pydantic = ">=2"
requests = "*"
model-serving = { path = "/k8s-nfs/personal/drmchang/projects/model_serving", editable = true }

[feature.bench.tasks.serve]
description = "Qwen edit server: serve --model {qwen2511,firered11,qwen21turbo} --port N"
cmd = "python scripts/qwen_server.py"
# /usr/local/cuda/lib64 (often on LD_LIBRARY_PATH) holds a system cuDNN 9.8 that shadows
# torch's bundled cuDNN sub-libraries -> CUDNN_STATUS_SUBLIBRARY_LOADING_FAILED in the VAE.
env = { LD_LIBRARY_PATH = "" }

[feature.bench.tasks.client]
description = "Send an edit to the server (see scripts/qwen_client.py --help)"
cmd = "python scripts/qwen_client.py"

[environments]
bench = { features = ["bench"], no-default-feature = true }
